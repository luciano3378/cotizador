<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cotizador">
<meta name="theme-color" content="#1b6f80">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cotizador de aberturas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#EEF1F2;--card:#fff;--ink:#1d2a30;--mute:#62727a;--line:#d9e0e3;--acc:#1b6f80;--accsoft:#dcecef;--hi:#fff4e3;--hiink:#8a4b08;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11191d;--card:#1a252a;--ink:#e8eef0;--mute:#93a4ac;--line:#2b3a41;--acc:#5ec0d3;--accsoft:#1f3a41;--hi:#3a2a14;--hiink:#f2b873;--danger:#f2b8b5}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
h1{font:700 26px/1.1 "Barlow Condensed",Barlow,sans-serif;margin:4px 0 14px}
h2{font:600 13px/1 Barlow,sans-serif;color:var(--mute);margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.sp{margin-top:12px}
.stepper{display:flex;align-items:stretch;gap:8px}
.stepper button{width:48px;flex:none;font-size:22px}
.stepper input{text-align:center}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#0b1a1e}}
button.del{color:var(--danger);width:44px;padding:0;flex:none}
.res{background:var(--acc);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .res{color:#0b1a1e}}
.res small{opacity:.85;font-size:13px}
.big{font:700 40px/1.05 "Barlow Condensed",Barlow,sans-serif;margin:2px 0 4px;letter-spacing:.2px}
.ln{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}
.ln span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.ln.cost{background:var(--hi);color:var(--hiink);font-weight:600;margin:0 -14px;padding:10px 14px;border-color:transparent}
.ln small{color:var(--mute)}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--card)}
.item .row{align-items:flex-end}
details summary{cursor:pointer;font-weight:600;padding:6px 0;min-height:36px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);position:sticky;bottom:0}
nav button{flex:1;border:0;border-radius:0;background:none;min-height:56px;color:var(--mute);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--tab,#1b6f80);box-shadow:inset 0 3px 0 var(--tab,#1b6f80)}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}
.empty{text-align:center;color:var(--mute);padding:20px 8px}
h1{border-left:6px solid var(--tab,#1b6f80);padding-left:10px}
.hero{background:linear-gradient(135deg,#0f4c5c,#1b6f80 55%,#2a9d8f);border-radius:16px;padding:8px 10px 0;margin-bottom:12px}
.hero svg{width:100%;height:auto;display:block}
.res{background:linear-gradient(135deg,#0f4c5c,#1b6f80 60%,#2a9d8f);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .res{color:#fff}}
.bar{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:2px 0 8px;background:var(--line)}
.bar i{display:block;height:100%;transition:width .4s}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.item{border-left:5px solid var(--u,#1b6f80);animation:pop .25s ease-out}
.ico{width:30px;height:30px;flex:none}
.item .row .ico{flex:none;width:30px}
#app>*{animation:pop .25s ease-out}
button:active{transform:scale(.97)}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
:root[data-theme="dark"]{--bg:#11191d;--card:#1a252a;--ink:#e8eef0;--mute:#93a4ac;--line:#2b3a41;--acc:#5ec0d3;--accsoft:#1f3a41;--hi:#3a2a14;--hiink:#f2b873;--danger:#f2b8b5;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"] button.pri{color:#0b1a1e}
body{position:relative}
#theme{position:absolute;top:12px;right:12px;z-index:5;width:44px;padding:0;border-radius:50%;display:grid;place-items:center}
#theme svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{margin-right:52px}
.logo{display:block;width:150px;max-width:60%;height:auto;margin:0 auto 12px}
:root[data-theme="dark"] .logo{filter:drop-shadow(0 0 2px rgba(255,255,255,.45))}
.ln .ico{width:20px;height:20px;vertical-align:-5px;margin-right:8px}
textarea{width:100%;font:13px/1.3 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button id="theme" aria-label="Cambiar tema"></button>
<main id="app"></main>
<nav id="nav"></nav>

function results(){
 var r=calc();
 var det=r.det.map(function(d){return'<div class="ln"><span>'+ic(d.x)+esc(d.n)+'<br><small>'+d.qty.toFixed(2).replace(".",",")+" "+esc(d.u)+'</small></span><span>'+money(d.cost)+'</span></div>'}).join("")||'<div class="empty">Este modelo todavía no tiene materiales.</div>';
 return'<div class="res"><small>Precio final por unidad (con IVA)</small><div class="big" id="bigp">'+money(shown)+'</div><small>'+(r.n>1?"Total × "+r.n+": "+money(r.fin*r.n):"Costo de fabricación: "+money(r.fab))+'</small></div>'+
 '<div class="card">'+bar(r)+line("Materia prima",money(r.mp),"","#2a9d8f")+line("Mano de obra",money(r.mo),"","#e9a23b")+line("Costos indirectos ("+S.p.ind+"%)",money(r.ind),"","#e4572e")+line("Costo de fabricación",money(r.fab),"cost")+line("Margen ("+S.p.mar+"%)",money(r.net-r.fab),"","#6c5ce7")+line("Precio sin IVA",money(r.net))+line("IVA ("+S.p.iva+"%)",money(r.iva),"","#8d99a6")+'</div>'+
 (r.n>1?'<div class="card">'+line("Costo de fabricación × "+r.n,money(r.fab*r.n))+line("Total sin IVA",money(r.net*r.n))+line("Total con IVA",money(r.fin*r.n),"")+'</div>':"")+
 '<div class="card"><details><summary>Detalle de materiales</summary>'+det+'</details></div>';
}
function viewCot(){
 var opts=S.models.map(function(m){return'<option value="'+m.id+'"'+(m.id==S.q.model?" selected":"")+'>'+esc(m.n)+'</option>'}).join("");
 $("#app").innerHTML='<img class="logo" src="'+LOGO+'" alt="Tu Carpintero, carpintería de aluminio"><h1>Cotizar abertura</h1><div class="card"><label for="q-model">Modelo</label><select id="q-model">'+opts+'</select>'+
 '<div class="row sp"><div><label for="q-w">Ancho (m)</label><input id="q-w" inputmode="decimal" value="'+String(S.q.w).replace(".",",")+'"></div><div><label for="q-h">Alto (m)</label><input id="q-h" inputmode="decimal" value="'+String(S.q.h).replace(".",",")+'"></div></div>'+
 '<label class="sp" for="q-n">Cantidad</label><div class="stepper"><button id="q-minus" aria-label="Menos">−</button><input id="q-n" inputmode="numeric" value="'+S.q.n+'"><button id="q-plus" aria-label="Más">+</button></div></div><div class="hero" id="win"></div><div id="res">'+results()+'</div>';
 var up=function(){$("#res").innerHTML=results();anim(calc().fin);winTo();save()};winTo();anim(calc().fin);
 $("#q-model").onchange=function(e){S.q.model=+e.target.value;up()};
 $("#q-w").oninput=function(e){S.q.w=num(e.target.value);up()};
 $("#q-h").oninput=function(e){S.q.h=num(e.target.value);up()};
 $("#q-n").oninput=function(e){S.q.n=Math.max(1,Math.round(num(e.target.value))||1);up()};
 $("#q-minus").onclick=function(){S.q.n=Math.max(1,S.q.n-1);$("#q-n").value=S.q.n;up()};
 $("#q-plus").onclick=function(){S.q.n++;$("#q-n").value=S.q.n;up()};
}
function viewMats(){
 var h='<h1>Materiales</h1><p class="hint" style="margin-top:-8px">Cargá el precio de compra (barra, rollo…) y cuánto trae: el costo por metro, m² o unidad se calcula solo.</p>';
 h+=S.mats.map(function(m,i){var opt=function(a,v){return a.map(function(u){return'<option'+(u==v?" selected":"")+'>'+u+'</option>'}).join("")};return'<div class="item" style="--u:'+(UC[m.u]||"#3b7ddd")+'"><div class="row" style="align-items:center">'+'<span id="ic'+i+'" style="display:flex">'+ic(m)+'</span>'+'<input data-i="'+i+'" data-f="n" value="'+esc(m.n)+'" aria-label="Nombre"><button class="del" data-del="'+i+'" aria-label="Borrar material">✕</button></div><div class="row sp"><div><label>Se compra por</label><select data-i="'+i+'" data-f="ub">'+opt(["Barra","Rollo","Plancha","Cartucho","Kit","Unidad","m²"],m.ub)+'</select></div><div><label>Precio ($)</label><input data-i="'+i+'" data-f="pc" inputmode="decimal" value="'+String(m.pc).replace(".",",")+'"></div></div><div class="row sp"><div><label>Trae ('+esc(m.u)+')</label><input data-i="'+i+'" data-f="pk" inputmode="decimal" value="'+String(m.pk).replace(".",",")+'"></div><div><label>Se usa en</label><select data-i="'+i+'" data-f="u">'+opt(["m","m²","un","kg","l"],m.u)+'</select></div></div><p class="hint" id="uc'+i+'">= <b>'+money(uc(m))+'</b> por '+esc(m.u)+'</p></div>'}).join("");
 if(!S.mats.length)h+='<div class="empty">Todavía no cargaste materiales.</div>';
 h+='<button class="pri" id="add" style="width:100%">Agregar material</button>';
 $("#app").innerHTML=h;
 document.querySelectorAll("[data-f]").forEach(function(el){var f=function(){var i=+el.dataset.i,k=el.dataset.f,m=S.mats[i];m[k]=(k=="pc"||k=="pk")?num(el.value):el.value;save();if(k=="n"){var w=$("#ic"+i);if(w)w.innerHTML=ic(m)}if(k=="u")return viewMats();var u=$("#uc"+i);if(u)u.innerHTML="= <b>"+money(uc(m))+"</b> por "+esc(m.u)};el.oninput=f;el.onchange=f});
 document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){var m=S.mats[+b.dataset.del];S.mats.splice(+b.dataset.del,1);S.models.forEach(function(x){x.lines=x.lines.filter(function(l){return l.m!=m.id})});save();viewMats()}});
 $("#add").onclick=function(){S.mats.push({id:++S.nid,n:"Nuevo material",ub:"Barra",pc:0,pk:6,u:"m"});save();viewMats()};
}
function viewModels(){
 var m=model(),h='<h1>Modelos</h1><div class="card"><label for="m-sel">Modelo</label><select id="m-sel">'+S.models.map(function(x){return'<option value="'+x.id+'"'+(x.id==m.id?" selected":"")+'>'+esc(x.n)+'</option>'}).join("")+'</select><div class="row sp"><button id="m-add">Nuevo modelo</button><button id="m-del" class="del" style="width:auto;padding:0 14px" aria-label="Borrar modelo">Borrar</button></div></div>';
 if(m){h+='<div class="card"><label>Nombre</label><input id="m-n" value="'+esc(m.n)+'"><div class="row sp"><div><label>Horas fijas</label><input id="m-hf" inputmode="decimal" value="'+String(m.hf).replace(".",",")+'"></div><div><label>Horas por m²</label><input id="m-hm" inputmode="decimal" value="'+String(m.hm).replace(".",",")+'"></div></div></div><h2>Materiales que lleva</h2>';
 h+=m.lines.map(function(l,i){return'<div class="item"><label>Material</label><select data-l="'+i+'" data-f="m">'+S.mats.map(function(x){return'<option value="'+x.id+'"'+(x.id==l.m?" selected":"")+'>'+esc(x.n)+'</option>'}).join("")+'</select><div class="row sp"><div><label>Cómo se calcula</label><select data-l="'+i+'" data-f="k">'+Object.keys(KINDS).map(function(k){return'<option value="'+k+'"'+(k==l.k?" selected":"")+'>'+KINDS[k]+'</option>'}).join("")+'</select></div></div><div class="row sp"><div><label>Cantidad</label><input data-l="'+i+'" data-f="q" inputmode="decimal" value="'+String(l.q).replace(".",",")+'"></div><div><label>Desperdicio %</label><input data-l="'+i+'" data-f="d" inputmode="decimal" value="'+String(l.d).replace(".",",")+'"></div><button class="del" data-ld="'+i+'" aria-label="Quitar material">✕</button></div></div>'}).join("");
 if(!m.lines.length)h+='<div class="empty">Agregá los materiales de este modelo.</div>';
 h+='<button class="pri" id="l-add" style="width:100%"'+(S.mats.length?"":" disabled")+'>Agregar material al modelo</button><p class="hint">Ejemplo: perfil con cantidad 2 «por ancho» = 2 × el ancho de la abertura.</p>';}
 $("#app").innerHTML=h;
 $("#m-sel").onchange=function(e){S.q.model=+e.target.value;save();viewModels()};
 $("#m-add").onclick=function(){var id=++S.nid;S.models.push({id:id,n:"Nuevo modelo",hf:0,hm:0,lines:[]});S.q.model=id;save();viewModels()};
 $("#m-del").onclick=function(){if(S.models.length<2)return;S.models=S.models.filter(function(x){return x.id!=m.id});S.q.model=S.models[0].id;save();viewModels()};
 if(!m)return;
 $("#m-n").oninput=function(e){m.n=e.target.value;save()};
 $("#m-hf").oninput=function(e){m.hf=num(e.target.value);save()};
 $("#m-hm").oninput=function(e){m.hm=num(e.target.value);save()};
 document.querySelectorAll("[data-l]").forEach(function(el){var f=function(){var l=m.lines[+el.dataset.l],k=el.dataset.f;l[k]=(k=="q"||k=="d")?num(el.value):(k=="m"?+el.value:el.value);save()};el.oninput=f;el.onchange=f});
 document.querySelectorAll("[data-ld]").forEach(function(b){b.onclick=function(){m.lines.splice(+b.dataset.ld,1);save();viewModels()}});
 var la=$("#l-add");if(la)la.onclick=function(){m.lines.push({m:S.mats[0].id,k:"fix",q:1,d:0});save();viewModels()};
}
function viewSet(){
 var P=S.p;
 $("#app").innerHTML='<h1>Ajustes</h1><div class="card"><label>Costo hora de mano de obra ($/h)</label><input id="p-hh" inputmode="decimal" value="'+P.hh+'"><label class="sp">Costos indirectos (% sobre materia prima + mano de obra)</label><input id="p-ind" inputmode="decimal" value="'+P.ind+'"><label class="sp">Margen de ganancia (% sobre el costo de fabricación)</label><input id="p-mar" inputmode="decimal" value="'+P.mar+'"><label class="sp">IVA (%)</label><input id="p-iva" inputmode="decimal" value="'+P.iva+'"></div>'+
 '<h2>Usar en otro celular</h2><div class="card"><p class="hint" style="margin-top:0">Tus datos se guardan en cada celular por separado. Copiá este código, abrí la app en el otro celular, pegálo acá y tocá «Cargar datos».</p><label class="sp" for="x-code">Código de tus datos</label><textarea id="x-code" rows="4">'+btoa(unescape(encodeURIComponent(JSON.stringify(S))))+'</textarea><div class="row sp"><button id="x-copy">Copiar código</button><button id="x-load" class="pri">Cargar datos</button></div><p class="hint" id="x-msg" role="status"></p></div>'+
 '<p class="hint">Los datos se guardan en este dispositivo. Los valores iniciales son de ejemplo: reemplazalos por los tuyos.</p><button id="reset" class="sp" style="width:100%">Volver a los datos de ejemplo</button>';
 ["hh","ind","mar","iva"].forEach(function(k){$("#p-"+k).oninput=function(e){P[k]=num(e.target.value);save()}});
 var xc=$("#x-code");xc.onfocus=function(){xc.select()};
 $("#x-copy").onclick=function(){xc.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(xc.value).catch(function(){});$("#x-msg").textContent="Código copiado. Si no se copió, mantuvé apretado el texto y elegí Copiar."};
 $("#x-load").onclick=function(){try{var d=JSON.parse(decodeURIComponent(escape(atob(xc.value.trim()))));if(!d.mats||!d.models||!d.p||!d.q)throw 0;d.nid=d.nid||200;d.theme=S.theme;S=d;save();tab="cot";draw()}catch(e){$("#x-msg").textContent="El código no es válido. Copialo completo desde el otro celular."}};
 var armed=false;$("#reset").onclick=function(){if(!armed){armed=true;this.textContent="Tocá de nuevo para borrar todo";this.style.color="var(--danger)";return}var th=S.theme;S=seed();S.theme=th;save();tab="cot";draw()};
}
var ICONS={cot:'<path d="M5 3h14v18H5zM8 7h8M8 11h2M12 11h2M8 15h2M12 15h2"/>',mat:'<path d="M12 3l9 4.5-9 4.5-9-4.5zM3 12l9 4.5 9-4.5M3 16.5L12 21l9-4.5"/>',mod:'<path d="M4 4h16v16H4zM12 4v16M4 12h16"/>',set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
var NAMES={cot:"Cotizar",mat:"Materiales",mod:"Modelos",set:"Ajustes"};
var TC={cot:"#1b6f80",mat:"#e9a23b",mod:"#6c5ce7",set:"#6b7a83"};
var SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>',MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function isDark(){return S.theme?S.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function applyTheme(){var d=isDark(),b=$("#theme");document.documentElement.setAttribute("data-theme",d?"dark":"light");b.innerHTML=d?SUN:MOON;b.setAttribute("aria-label",d?"Cambiar a contraste claro":"Cambiar a pantalla oscura");b.title=b.getAttribute("aria-label")}
$("#theme").onclick=function(){S.theme=isDark()?"light":"dark";save();applyTheme()};
function draw(){applyTheme();document.body.style.setProperty("--tab",TC[tab]);
 $("#nav").innerHTML=Object.keys(NAMES).map(function(k){return'<button data-t="'+k+'" aria-current="'+(k==tab)+'"><svg viewBox="0 0 24 24">'+ICONS[k]+'</svg>'+NAMES[k]+'</button>'}).join("");
 document.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){tab=b.dataset.t;draw()}});
 ({cot:viewCot,mat:viewMats,mod:viewModels,set:viewSet})[tab]();
 $("#app").scrollTop=0;
}
draw();
})();
</script>
</body>
</html>
